[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sync-tools"
version = "0.1.0"
description = "Sync git repositories across air-gapped networks using git bundles"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["click>=8.1"]

[project.scripts]
sync-tools    = "sync_tools.cli:main"
pipeline-gen  = "pipeline_gen.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/sync_tools", "src/pipeline_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-v"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests
